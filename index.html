<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      position: relative;
    }

    textarea {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: monospace, monospace;
      font-size: 1.2rem;
      line-height: 1.5;
      border: none;
      outline: none;
      resize: none;
      padding: 1.5rem 1.5rem 1.5rem 1rem;
      
      /* Standard red blinking cursor */
      caret-color: #ff0000;
    }

    textarea::selection {
      background-color: #ff0000;
      color: #ffffff;
    }

    /* Custom red blinking pipe shown when idle/unfocused and empty */
    .empty-prompt {
      position: absolute;
      top: 1.5rem;
      left: 1rem;
      color: #ff0000;
      font-family: monospace, monospace;
      font-size: 1.2rem;
      line-height: 1.5;
      pointer-events: none;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Custom blinking cursor for unfocused empty state -->
  <div id="prompt" class="empty-prompt">|</div>
  
  <textarea id="notepad" spellcheck="false"></textarea>

  <script>
    const notepad = document.getElementById('notepad');
    const prompt = document.getElementById('prompt');

    function updatePromptVisibility() {
      // Hide prompt if the user is currently focused/typing OR if text exists
      if (document.activeElement === notepad || notepad.value !== '') {
        prompt.style.display = 'none';
      } else {
        prompt.style.display = 'block';
      }
    }

    // Load saved content from local storage
    notepad.value = localStorage.getItem('notepad_content') || '';
    updatePromptVisibility();

    // Save changes as user types
    notepad.addEventListener('input', () => {
      localStorage.setItem('notepad_content', notepad.value);
      updatePromptVisibility();
    });

    // Hide prompt immediately on touch/click focus
    notepad.addEventListener('focus', updatePromptVisibility);

    // Bring back prompt if empty when user clicks away / unfocuses
    notepad.addEventListener('blur', updatePromptVisibility);
  </script>

</body>
</html>
