<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }

    textarea {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: monospace, monospace;
      font-size: 1.2rem;
      line-height: 1.5;
      border: none;
      outline: none;
      resize: none;
      /* Adjusted padding: reduced left side space from 5rem to 1rem */
      padding: 1.5rem 1.5rem 1.5rem 1rem;
      
      caret-color: #ff0000;
    }

    textarea::selection {
      background-color: #ff0000;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <textarea id="notepad" placeholder="" autofocus spellcheck="false"></textarea>

  <script>
    const notepad = document.getElementById('notepad');

    // Load saved content from local storage when the page opens
    notepad.value = localStorage.getItem('notepad_content') || '';

    // Save content automatically whenever the user types
    notepad.addEventListener('input', () => {
      localStorage.setItem('notepad_content', notepad.value);
    });
  </script>

</body>
</html>
