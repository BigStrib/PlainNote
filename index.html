<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
        }
        textarea,
        .fake-cursor {
            font-family: monospace, monospace;
            font-size: 1.2rem;
            line-height: 1.5;
        }
        textarea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 1.5rem 1.5rem 1.5rem 1rem;
            background: #000000;
            color: #ffffff;
            border: none;
            outline: none;
            resize: none;
            overflow: auto;
            caret-color: #ff0000;
            z-index: 1;
        }
        textarea::selection {
            background: #ff0000;
            color: #ffffff;
        }
        /*
         * Fake cursor.
         *
         * Same font, size, line-height and position as
         * the first character in the textarea.
         */
        .fake-cursor {
            position: fixed;
            top: 1.5rem;
            left: 1rem;
            color: #ff0000;
            pointer-events: none;
            user-select: none;
            z-index: 2;
        }
        .fake-cursor.hidden {
            display: none;
        }
        .fake-cursor.invisible {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div id="fakeCursor" class="fake-cursor">|</div>
    <textarea
        id="notepad"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
    ></textarea>
    <script>
        const notepad = document.getElementById("notepad");
        const fakeCursor = document.getElementById("fakeCursor");
        const STORAGE_KEY = "notepad_content";
        let blinkTimer = null;
        let cursorVisible = true;
        /*
         * Start the fake cursor blinking.
         *
         * JavaScript controls the blinking instead of CSS.
         * This is more reliable when the page is hosted inside
         * a WebView or application shell.
         */
        function startBlinking() {
            stopBlinking();
            cursorVisible = true;
            fakeCursor.classList.remove("invisible");
            blinkTimer = setInterval(() => {
                cursorVisible = !cursorVisible;
                if (cursorVisible) {
                    fakeCursor.classList.remove("invisible");
                } else {
                    fakeCursor.classList.add("invisible");
                }
            }, 500);
        }
        /*
         * Stop blinking and reset the cursor.
         */
        function stopBlinking() {
            if (blinkTimer !== null) {
                clearInterval(blinkTimer);
                blinkTimer = null;
            }
            cursorVisible = true;
            fakeCursor.classList.remove("invisible");
        }
        /*
         * Update the cursor depending on whether the document
         * contains any text.
         */
        function updateCursor() {
            const isEmpty = notepad.value.length === 0;
            if (isEmpty) {
                /*
                 * Empty document:
                 * show fake blinking cursor and hide the
                 * browser's real caret.
                 */
                fakeCursor.classList.remove("hidden");
                notepad.style.caretColor = "transparent";
                startBlinking();
            } else {
                /*
                 * Document contains text:
                 * remove fake cursor and restore real caret.
                 */
                fakeCursor.classList.add("hidden");
                notepad.style.caretColor = "#ff0000";
                stopBlinking();
            }
        }
        /*
         * Load saved text.
         */
        notepad.value = localStorage.getItem(STORAGE_KEY) || "";
        /*
         * Save whenever the document changes.
         *
         * This also catches deleting the final character.
         */
        notepad.addEventListener("input", () => {
            localStorage.setItem(STORAGE_KEY, notepad.value);
            updateCursor();
        });
        /*
         * Initial state.
         */
        updateCursor();
    </script>
</body>
</html>
