<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
        }
        /*
         * These values are shared by the textarea and
         * fake cursor so they occupy the exact same
         * text position.
         */
        textarea,
        .fake-cursor {
            font-family: monospace, monospace;
            font-size: 1.2rem;
            line-height: 1.5;
        }
        textarea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 1.5rem 1.5rem 1.5rem 1rem;
            background: #000000;
            color: #ffffff;
            border: none;
            outline: none;
            resize: none;
            overflow: auto;
            /*
             * The real caret is red when text exists.
             * JavaScript changes this to transparent when
             * the document is completely empty.
             */
            caret-color: #ff0000;
            z-index: 1;
        }
        textarea::selection {
            background: #ff0000;
            color: #ffffff;
        }
        /*
         * Fake blinking cursor.
         *
         * It is placed at the exact same coordinates as
         * the textarea's first character position.
         */
        .fake-cursor {
            position: fixed;
            top: 1.5rem;
            left: 1rem;
            color: #ff0000;
            pointer-events: none;
            user-select: none;
            z-index: 2;
            animation: blink 1s steps(1, end) infinite;
        }
        .fake-cursor.hidden {
            display: none;
        }
        @keyframes blink {
            0%,
            49% {
                opacity: 1;
            }
            50%,
            100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="fakeCursor" class="fake-cursor">|</div>
    <textarea
        id="notepad"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
    ></textarea>
    <script>
        const notepad = document.getElementById("notepad");
        const fakeCursor = document.getElementById("fakeCursor");
        const STORAGE_KEY = "notepad_content";
        /*
         * Update the cursor state.
         *
         * When the document is completely empty:
         *   - The fake blinking cursor is shown.
         *   - The browser's real caret is hidden.
         *
         * When there is text:
         *   - The fake cursor disappears.
         *   - The normal red browser caret is restored.
         */
        function updateCursor() {
            const isEmpty = notepad.value.length === 0;
            if (isEmpty) {
                fakeCursor.classList.remove("hidden");
                notepad.style.caretColor = "transparent";
            } else {
                fakeCursor.classList.add("hidden");
                notepad.style.caretColor = "#ff0000";
            }
        }
        /*
         * Load saved document.
         */
        notepad.value = localStorage.getItem(STORAGE_KEY) || "";
        /*
         * Save changes and update the cursor.
         *
         * This fires when text is typed AND when text is deleted.
         */
        notepad.addEventListener("input", () => {
            localStorage.setItem(STORAGE_KEY, notepad.value);
            updateCursor();
        });
        /*
         * Initial cursor state.
         */
        updateCursor();
    </script>
</body>
</html>
