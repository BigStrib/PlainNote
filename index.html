<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlainNote</title>
  <link rel="icon" type="image/png" href="images/favi.png">
  <style>
    /* Reset margins/padding and force full-screen height */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }

    /* Full-screen textarea with padding on the left */
    textarea {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: monospace, monospace;
      font-size: 1.2rem;
      line-height: 1.5;
      border: none;
      outline: none;
      resize: none;
      /* Padding leaves space on the left side */
      padding: 2rem 2rem 2rem 5rem;
      
      /* Red blinking text cursor */
      caret-color: #ff0000;
    }

    /* Red highlight color when text is selected */
    textarea::selection {
      background-color: #ff0000;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <textarea placeholder="" autofocus spellcheck="false"></textarea>

</body>
</html>
