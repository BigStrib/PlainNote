<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }

    /* Shared typography parameters ensure identical proportions */
    textarea, .empty-prompt {
      font-family: monospace, monospace;
      font-size: 1.2rem;
      line-height: 1.5;
      padding: 1.5rem 1.5rem 1.5rem 1rem;
    }

    textarea {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      border: none;
      outline: none;
      resize: none;
      
      /* Real red blinking cursor */
      caret-color: #ff0000;
    }

    textarea::selection {
      background-color: #ff0000;
      color: #ffffff;
    }

    /* Custom red blinking pipe aligned identically to the text canvas */
    .empty-prompt {
      position: absolute;
      top: 0;
      left: 0;
      color: #ff0000;
      pointer-events: none;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Custom blinking cursor element -->
  <div id="prompt" class="empty-prompt">|</div>
  
  <textarea id="notepad" spellcheck="false"></textarea>

  <script>
    const notepad = document.getElementById('notepad');
    const prompt = document.getElementById('prompt');

    function updatePromptVisibility() {
      // Hide the fake pipe whenever focused OR when content exists
      if (document.activeElement === notepad || notepad.value !== '') {
        prompt.style.display = 'none';
      } else {
        prompt.style.display = 'block';
      }
    }

    // Load saved content from local storage
    notepad.value = localStorage.getItem('notepad_content') || '';
    updatePromptVisibility();

    // Event handlers for focus state & input changes
    notepad.addEventListener('input', () => {
      localStorage.setItem('notepad_content', notepad.value);
      updatePromptVisibility();
    });

    notepad.addEventListener('focus', updatePromptVisibility);
    notepad.addEventListener('blur', updatePromptVisibility);
  </script>

</body>
</html>
